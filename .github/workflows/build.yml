name: Build STStealth Dylib

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  DYLIB_NAME: libSTStealth
  IOS_MIN: "14.0"
  IMGUI_VERSION: "v1.90.4"

jobs:
  build:
    name: Build iOS Dylib on macOS
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version and SDKs
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Select latest Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Cache ImGui
        id: cache-imgui
        uses: actions/cache@v4
        with:
          path: imgui
          key: imgui-${{ env.IMGUI_VERSION }}

      - name: Clone ImGui
        if: steps.cache-imgui.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch ${{ env.IMGUI_VERSION }} \
            https://github.com/ocornut/imgui.git imgui
          ls -la imgui/
          ls -la imgui/backends/ | head -30

      - name: Verify ImGui files present
        run: |
          test -f imgui/imgui.h || (echo "imgui.h missing" && exit 1)
          test -f imgui/imgui.cpp || (echo "imgui.cpp missing" && exit 1)
          test -f imgui/backends/imgui_impl_metal.mm || (echo "imgui_impl_metal.mm missing" && exit 1)
          echo "All ImGui files present."

      - name: Cache Theos SDKs
        id: cache-sdks
        uses: actions/cache@v4
        with:
          path: ~/theos-sdks
          key: theos-sdks-v1

      - name: Download iOS SDK
        if: steps.cache-sdks.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/theos-sdks
          cd ~/theos-sdks
          curl -L -o sdks.tar.gz https://github.com/theos/sdks/archive/refs/heads/master.tar.gz
          tar -xzf sdks.tar.gz
          ls -la
          ls -la sdks-master/ | head -40

      - name: Prepare SDK path
        run: |
          mkdir -p $HOME/theos/sdks
          if [ -d "$HOME/theos-sdks/sdks-master" ]; then
            cp -R $HOME/theos-sdks/sdks-master/* $HOME/theos/sdks/ 2>/dev/null || true
          fi
          ls -la $HOME/theos/sdks/ || true

      - name: Install build dependencies
        run: |
          brew install ldid xz || true

      - name: Compile dylib
        run: |
          SDK_PATH=""
          for candidate in \
              "$HOME/theos/sdks/iPhoneOS16.5.sdk" \
              "$HOME/theos/sdks/iPhoneOS16.4.sdk" \
              "$HOME/theos/sdks/iPhoneOS16.1.sdk" \
              "$HOME/theos/sdks/iPhoneOS15.6.sdk"; do
            if [ -d "$candidate" ]; then
              SDK_PATH="$candidate"
              break
            fi
          done

          if [ -z "$SDK_PATH" ]; then
            SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path 2>/dev/null)
          fi

          if [ -z "$SDK_PATH" ] || [ ! -d "$SDK_PATH" ]; then
            echo "ERROR: No iOS SDK found"
            ls -la $HOME/theos/sdks/ || true
            exit 1
          fi

          echo "Using SDK: $SDK_PATH"
          mkdir -p build_output

          OBJ_FILES=""

          for src in ./STEntry.mm ./STMenu.mm; do
            if [ ! -f "$src" ]; then
              echo "WARN: $src missing"
              continue
            fi
            obj="build_output/$(basename ${src%.mm}).o"
            echo "Compiling $src"
            clang++ -c \
              -arch arm64 \
              -arch arm64e \
              -isysroot "$SDK_PATH" \
              -miphoneos-version-min=${{ env.IOS_MIN }} \
              -fobjc-arc \
              -fmodules \
              -std=c++17 \
              -I. \
              -I./imgui \
              -I./imgui/backends \
              -O2 \
              -fvisibility=hidden \
              -o "$obj" \
              "$src"
            OBJ_FILES="$OBJ_FILES $obj"
          done

          for src in \
              imgui/imgui.cpp \
              imgui/imgui_draw.cpp \
              imgui/imgui_tables.cpp \
              imgui/imgui_widgets.cpp \
              imgui/backends/imgui_impl_metal.mm; do
            if [ ! -f "$src" ]; then
              echo "WARN: $src missing"
              continue
            fi
            obj="build_output/$(basename ${src%.*}).o"
            echo "Compiling $src"
            clang++ -c \
              -arch arm64 \
              -arch arm64e \
              -isysroot "$SDK_PATH" \
              -miphoneos-version-min=${{ env.IOS_MIN }} \
              -fobjc-arc \
              -fmodules \
              -std=c++17 \
              -I. \
              -I./imgui \
              -I./imgui/backends \
              -O2 \
              -o "$obj" \
              "$src"
            OBJ_FILES="$OBJ_FILES $obj"
          done

          echo "Linking..."
          clang++ -dynamiclib \
            -arch arm64 \
            -arch arm64e \
            -isysroot "$SDK_PATH" \
            -miphoneos-version-min=${{ env.IOS_MIN }} \
            -framework Foundation \
            -framework UIKit \
            -framework Metal \
            -framework QuartzCore \
            -framework CoreGraphics \
            -install_name @rpath/${{ env.DYLIB_NAME }}.dylib \
            -compatibility_version 1.0.0 \
            -current_version 1.0.0 \
            -o build_output/${{ env.DYLIB_NAME }}.dylib \
            $OBJ_FILES

          file build_output/${{ env.DYLIB_NAME }}.dylib

      - name: Sign dylib with ldid (ad-hoc)
        run: |
          ldid -S build_output/${{ env.DYLIB_NAME }}.dylib || true

      - name: Verify output
        run: |
          file build_output/${{ env.DYLIB_NAME }}.dylib
          lipo -info build_output/${{ env.DYLIB_NAME }}.dylib || true
          otool -L build_output/${{ env.DYLIB_NAME }}.dylib || true
          ls -la build_output/

      - name: Upload dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: STStealth-dylib
          path: build_output/*.dylib
          retention-days: 30
          if-no-files-found: error
